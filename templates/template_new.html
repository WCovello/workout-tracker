{% extends 'base.html' %}
{% block title %}New Template — Workout Tracker{% endblock %}
{% block content %}

<h1>New Template</h1>

<form method="POST">
    <label for="name">Template Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Push Day, Pull Day, Legs" required>

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" name="notes" rows="2"
              placeholder="e.g. Post-boulder session, ~40 min"></textarea>

    <div class="mt">
        <button type="submit" class="btn btn-primary">Create Template</button>
        <a href="/templates" class="btn btn-neutral">Cancel</a>
    </div>
</form>

{% endblock %}
